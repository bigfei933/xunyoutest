version: 2.1

jobs:
  webhook-test-job:
    docker:
      # 换成 Docker 官方轻量镜像，避免 CircleCI 镜像拉取限制
      - image: busybox:latest
    steps:
      # 执行一条简单命令，确保 Job 能跑完
      - run: echo "CircleCI Workflow Test - Webhook Trigger"
      # 可选：故意让 Job 失败（exit 1），不影响 Webhook 触发，只是状态显示为 Failed
      # - run: exit 1

workflows:
  test-workflow:
    jobs:
      - webhook-test-job
